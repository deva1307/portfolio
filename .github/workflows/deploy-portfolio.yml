name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          source = Path("frontend/Index.html").read_text(encoding="utf-8")
          local_endpoint = "var CONTACT_ENDPOINT = 'http://127.0.0.1:5017/contact';"
          form_flag = "var CONTACT_FORM_UNAVAILABLE = false;"
          if source.count(local_endpoint) != 1 or source.count(form_flag) != 1:
              sys.exit("Could not find the expected contact form settings in frontend/Index.html.")

          site = Path("_site")
          site.mkdir()
          (site / "index.html").write_text(
              source.replace(local_endpoint, "var CONTACT_ENDPOINT = '';").replace(
                  form_flag, "var CONTACT_FORM_UNAVAILABLE = true;"
              ),
              encoding="utf-8",
          )
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
